[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-retention-mcp"
version = "0.1.0"
description = "Deterministic cohort retention & inferred churn analysis exposed via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.2",
    "pandas>=2.3.3",
    "pyarrow>=17.0.0",
    "openpyxl>=3.1.5",
    "requests>=2.32.3",
    "mcp[cli]>=1.2.0",
    "anthropic>=0.39.0",
    "pydantic>=2.9.2",
    "pytest>=8.3.3",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]